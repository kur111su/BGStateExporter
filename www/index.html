<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战旗局面面板</title>
<style>
  :root {
    --bg: #15110c;
    --panel: #221a12;
    --panel-2: #2b2117;
    --line: #4a3a26;
    --brass: #c9a45c;
    --brass-dim: #8a7040;
    --text: #f2e7d0;
    --muted: #a8977a;
    --atk: #e7b13a;
    --hp: #c8432f;
    --gold: #f4c542;
    --shield: #ffe27a;
    --frozen: #7cc8ff;
    --ok: #6fbf73;
    --warn: #e0a03a;
    --bad: #d0574a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -200px, #3a2a18 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font: 14px/1.45 "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 16px; }

  /* 顶栏 */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 14px;
  }
  .brand { font-weight: 700; letter-spacing: .08em; color: var(--brass); margin-right: 4px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px rgba(208,87,74,.18); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(111,191,115,.18); }
  .dot.demo { background: var(--warn); box-shadow: 0 0 0 3px rgba(224,160,58,.18); }
  .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--brass-dim); color: var(--brass);
  }
  .pill.recruit { background: rgba(111,191,115,.12); border-color: #4f8a52; color: #9fdca2; }
  .pill.combat { background: rgba(208,87,74,.14); border-color: #8f3d33; color: #f0a196; }
  .stat { display: inline-flex; align-items: baseline; gap: 6px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .coins { display: inline-flex; gap: 3px; vertical-align: middle; }
  .coin { width: 12px; height: 12px; border-radius: 50%; background: #3a2e1e; border: 1px solid #5a4728; }
  .coin.on { background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 55%, #a67b16); border-color: #a67b16; }
  .stars { color: var(--gold); letter-spacing: 1px; }
  .stars .off { color: #4a3a26; }
  .races { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 6px;
    background: #2f2418; border: 1px solid var(--line); color: var(--text);
  }

  .banner {
    background: rgba(224,160,58,.12); border: 1px solid #7d5a20; color: #f0c98a;
    border-radius: var(--radius); padding: 8px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .banner code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 4px; }

  /* 主布局 */
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 13px; font-weight: 700; color: var(--brass);
    letter-spacing: .12em; display: flex; align-items: center; gap: 8px;
  }
  .panel h2 .sub { color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 12px; }
  .stack { display: grid; gap: 14px; }

  /* 排行榜 */
  .lb { display: grid; gap: 6px; }
  .lb-row {
    display: grid; grid-template-columns: 22px 40px 1fr auto; align-items: center; gap: 8px;
    padding: 5px 6px; border-radius: 8px; border: 1px solid transparent;
  }
  .lb-row.me { background: rgba(201,164,92,.12); border-color: var(--brass-dim); }
  .lb-row.vs { box-shadow: inset 3px 0 0 var(--bad); }
  .lb-row.dead { opacity: .38; filter: grayscale(1); }
  .lb-place { color: var(--muted); font-weight: 700; text-align: center; }
  .lb-art {
    width: 40px; height: 40px; border-radius: 50%; background: #2f2418 center/cover no-repeat;
    border: 2px solid var(--line);
  }
  .lb-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-tier { font-size: 11px; color: var(--muted); }
  .lb-hp { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb-hp .armor { color: #9fb7c9; font-size: 11px; font-weight: 400; display: block; }
  .bar { height: 3px; background: #3a2e1e; border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--hp); }

  /* 卡牌行 */
  .row { display: flex; flex-wrap: wrap; gap: 12px; min-height: 120px; align-items: flex-start; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 4px; }

  .card { width: 104px; text-align: center; position: relative; }
  .portrait {
    width: 104px; height: 128px; margin: 0 auto;
    border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
    background: #2f2418 center 28% / 160% no-repeat;
    border: 3px solid #6b5536; position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,.45);
  }
  .card.spell .portrait { border-radius: 12px; height: 118px; border-color: #5d6a8a; }
  .card.golden .portrait { border-color: #e8c35a; box-shadow: 0 0 0 2px #7a5a14, 0 0 14px rgba(244,197,66,.45); }
  .card.taunt .portrait { outline: 5px solid #6f6a62; outline-offset: 2px; border-radius: 18px 18px 40% 40%; }
  .card.ds .portrait::after {
    content: ""; position: absolute; inset: -7px; border-radius: inherit;
    border: 3px solid var(--shield); box-shadow: 0 0 14px rgba(255,226,122,.75); pointer-events: none;
  }
  .card.frozen .portrait::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(160deg, rgba(124,200,255,.55), rgba(124,200,255,.15)); pointer-events: none;
  }
  .card.stealth .portrait { filter: saturate(.6) brightness(.8); border-style: dashed; }
  .fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 10px; font-size: 12px; color: var(--muted); text-align: center;
  }
  .tier {
    position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    background: #1b140d; border: 1px solid var(--brass-dim); border-radius: 999px;
    padding: 0 6px; font-size: 11px; color: var(--gold); white-space: nowrap; z-index: 2;
  }
  .badge {
    position: absolute; bottom: -6px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff; z-index: 2;
    text-shadow: 0 1px 0 #000, 0 0 3px #000; border: 2px solid #1b140d;
    font-variant-numeric: tabular-nums;
  }
  .badge.atk { left: -4px; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--atk) 60%, #8a5f0c); }
  .badge.hp { right: -4px; background: radial-gradient(circle at 35% 30%, #ff9b84, var(--hp) 60%, #6e1a0f); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; }
  .badge.cost { left: -4px; top: -6px; bottom: auto; background: radial-gradient(circle at 35% 30%, #fff2b0, var(--gold) 55%, #a67b16); color: #3a2a00; text-shadow: none; }
  .pos {
    position: absolute; top: 4px; left: 4px; font-size: 10px; color: var(--muted);
  }
  .name {
    margin-top: 10px; font-size: 12px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta { font-size: 11px; color: var(--muted); min-height: 16px; }
  .kw { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 3px; }
  .kw span {
    font-size: 10px; padding: 0 5px; border-radius: 4px; line-height: 16px;
    background: #2f2418; border: 1px solid var(--line); color: var(--text);
  }
  .kw .k-ven, .kw .k-poi { color: #9be37a; border-color: #3f6b2f; }
  .kw .k-ds { color: var(--shield); border-color: #7a6a2a; }
  .kw .k-reb { color: #a9e6ff; border-color: #2f5c6b; }
  .kw .k-frz { color: var(--frozen); border-color: #2f5c7a; }

  .heropowers { display: flex; flex-wrap: wrap; gap: 8px; }
  .hp-card {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px;
    border: 1px solid var(--line); border-radius: 999px; background: #2b2117;
  }
  .hp-card .art { width: 34px; height: 34px; border-radius: 50%; background: #3a2e1e center/cover no-repeat; border: 2px solid var(--brass-dim); }
  .hp-card.used { opacity: .45; }
  .hp-card .c { font-size: 11px; color: var(--muted); }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .split { grid-template-columns: 1fr; } }

  details.raw { margin-top: 14px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.raw pre {
    max-height: 420px; overflow: auto; background: #0e0b08; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; color: #d8cbb0;
  }
  button.copy {
    background: #2f2418; color: var(--text); border: 1px solid var(--brass-dim); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; margin-left: 8px;
  }
  /* 对战模拟 */
  .sim-live { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-bottom: 12px; }
  .sim-live .label { color: var(--muted); font-size: 12px; }
  .wtl { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #2f2418; font-size: 11px; font-weight: 700; }
  .wtl > span { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; min-width: 0; }
  .wtl .w { background: #3f7a43; color: #e6ffe7; }
  .wtl .t { background: #5b5240; color: #efe4c8; }
  .wtl .l { background: #8f3d33; color: #ffe5e0; }
  .sim-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sim-meta b { color: var(--text); font-weight: 700; }
  .mu { display: grid; gap: 6px; }
  .mu-row {
    display: grid; grid-template-columns: 34px minmax(90px, 160px) 1fr auto; gap: 10px; align-items: center;
    padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; background: #261d14;
  }
  .mu-row.next { border-color: var(--brass-dim); background: rgba(201,164,92,.10); }
  .mu-row .art { width: 34px; height: 34px; border-radius: 50%; background: #3a2e1e center/cover no-repeat; border: 2px solid var(--line); }
  .mu-row .who { font-size: 13px; overflow: hidden; }
  .mu-row .who div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu-row .who small { color: var(--muted); font-size: 11px; }
  .tag-next { font-size: 10px; color: #1b140d; background: var(--brass); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  button.btn {
    background: #3a2c1c; color: var(--text); border: 1px solid var(--brass-dim); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; white-space: nowrap;
  }
  button.btn:hover { background: #4a3822; }
  button.btn.primary { background: var(--brass); color: #1b140d; border-color: var(--brass); font-weight: 700; }
  button.btn:disabled { opacity: .45; cursor: default; }
  .opt { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .opt-msg { font-size: 13px; }
  .opt-cmp { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .order { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 8px; font-size: 12px; }
  .order span.m { background: #2f2418; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .order span.m.moved { border-color: var(--brass); color: var(--gold); }
  .order .arrow { color: var(--muted); }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--brass-dim); border-top-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 640px) {
    .mu-row { grid-template-columns: 34px 1fr auto; }
    .mu-row .wtl-wrap { grid-column: 1 / -1; order: 5; }
    .sim-live { grid-template-columns: 1fr; }
  }

  .center-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
  .center-msg b { display: block; font-size: 20px; color: var(--text); margin-bottom: 6px; }
</style>
</head>

</div>

          winRate: 0.583, tieRate: 0.071, lossRate: 0.346, winLethal: 0, lossLethal: 0, avgDamageDealt: 10.2, avgDamageTaken: 8.3, simulationCount: 3000 },
        { opponentPlayerId: 11, heroCardId: 'TB_BaconShop_HERO_35', heroName: '尤格-萨隆', isNextOpponent: false, boardSeenTurn: 6, opponentMinionCount: 7,
          winRate: 0.311, tieRate: 0.052, lossRate: 0.637, winLethal: 0, lossLethal: 0, avgDamageDealt: 7.6, avgDamageTaken: 11.9, simulationCount: 3000 },
        { opponentPlayerId: 14, heroCardId: 'BG20_HERO_283', heroName: '盖尔温格', isNextOpponent: false, boardSeenTurn: 8, opponentMinionCount: 5,
          winRate: 0.802, tieRate: 0.043, lossRate: 0.155, winLethal: 0, lossLethal: 0, avgDamageDealt: 12.1, avgDamageTaken: 6.0, simulationCount: 3000 },
        { opponentPlayerId: 15, heroCardId: 'TB_BaconShop_HERO_11', heroName: '拉格纳罗斯', isNextOpponent: false, boardSeenTurn: 5, opponentMinionCount: 5,
          winRate: 0.904, tieRate: 0.021, lossRate: 0.075, winLethal: 0, lossLethal: 0, avgDamageDealt: 13.5, avgDamageTaken: 5.2, simulationCount: 3000 },
        { opponentPlayerId: 16, heroCardId: 'TB_BaconShop_HERO_28', heroName: '无尽的托奇', isNextOpponent: false, boardSeenTurn: 8, opponentMinionCount: 7,
          winRate: 0.457, tieRate: 0.088, lossRate: 0.455, winLethal: 0.402, lossLethal: 0, avgDamageDealt: 9.8, avgDamageTaken: 9.1, simulationCount: 3000 }
      ] },
      optimizer: { status: 'idle', requestId: 0, evaluated: 0, currentOrder: [], bestOrder: [], bestOrderNames: [] }
    }
  };

  // ---------- 渲染 ----------
  const stars = (n, max = 7) => n ? '★'.repeat(n) + `<span class="off">${'★'.repeat(Math.max(0, Math.min(max, 6) - n))}</span>` : '—';

  function cardHtml(c, opts = {}) {
    const cls = ['card', c.type === 'spell' ? 'spell' : 'minion'];
    if (c.golden) cls.push('golden');
    if (c.taunt) cls.push('taunt');
    if (c.divineShield) cls.push('ds');
    if (c.frozen) cls.push('frozen');
    if (c.stealth) cls.push('stealth');
    const kws = [];
    if (c.divineShield) kws.push(['k-ds', '圣盾']);
    if (c.taunt) kws.push(['', '嘲讽']);
    if (c.venomous) kws.push(['k-ven', '烈毒']);
    if (c.poisonous) kws.push(['k-poi', '剧毒']);
    if (c.reborn) kws.push(['k-reb', '复生']);
    if (c.windfury) kws.push(['', '风怒']);
    if (c.deathrattle) kws.push(['', '亡语']);
    if (c.stealth) kws.push(['', '潜行']);
    if (c.frozen) kws.push(['k-frz', '冻结']);
    const races = (c.races || []).map(r => RACE[r] || r).join(' / ');
    const isMinion = c.type === 'minion';
    return `
      <div class="${cls.join(' ')}" title="${esc(c.name)} · ${esc(c.cardId)} · 实体 #${c.entityId}">
        <div class="portrait" style="background-image:url('${ART(c.cardId)}')">
          ${c.tier ? `<span class="tier">${'★'.repeat(c.tier)}</span>` : ''}
          ${opts.showCost || c.type === 'spell' ? `<span class="badge cost">${c.cost}</span>` : ''}
          ${isMinion ? `<span class="badge atk">${c.attack}</span><span class="badge hp">${c.health}</span>` : ''}
        </div>
        <div class="name">${c.golden ? '✦ ' : ''}${esc(c.name || c.cardId)}</div>
        <div class="meta">${esc(races || (c.type === 'spell' ? '法术' : ''))}</div>
        <div class="kw">${kws.map(([k, t]) => `<span class="${k}">${t}</span>`).join('')}</div>
      </div>`;
  }

  const rowHtml = (cards, emptyText, opts) =>
    cards && cards.length ? `<div class="row">${cards.map(c => cardHtml(c, opts)).join('')}</div>`
                          : `<div class="row"><div class="empty">${emptyText}</div></div>`;

  function leaderboardHtml(lb, s) {
    if (!lb || !lb.length) return '<div class="empty">暂无排行榜数据</div>';
    const vs = s.opponent && s.opponent.heroCardId;
    return `<div class="lb">${lb.map(e => {
      const hpPct = Math.max(0, Math.min(100, (e.health / 40) * 100));
      const isNext = !e.isPlayer && s.phase !== 'combat' && e.playerId && e.playerId === s.nextOpponentPlayerId;
      const cls = ['lb-row', e.isPlayer ? 'me' : '', e.dead ? 'dead' : '', (vs && e.heroCardId === vs) || isNext ? 'vs' : ''].join(' ');
      return `<div class="${cls}">
        <span class="lb-place">${e.place}</span>
        <span class="lb-art" style="background-image:url('${ART(e.heroCardId)}')"></span>
        <span><div class="lb-name">${esc(e.heroName || e.heroCardId)}${e.isPlayer ? '（你）' : ''}${isNext ? '<span class="tag-next">下个</span>' : ''}</div>
          <div class="lb-tier">酒馆 ${e.tavernTier || '?'} 本</div>
          <div class="bar"><i style="width:${hpPct}%"></i></div></span>
        <span class="lb-hp">${e.dead ? '出局' : e.health}${e.armor ? `<span class="armor">+${e.armor} 甲</span>` : ''}</span>
      </div>`;
    }).join('')}</div>`;
  }

  // ---------- 对战模拟 ----------
  const pct = v => `${Math.round((v || 0) * 1000) / 10}%`;
  function wtlBar(r) {
    const seg = (cls, v, label) => v > 0.001 ? `<span class="${cls}" style="width:${v * 100}%">${v >= 0.12 ? label + ' ' + pct(v) : ''}</span>` : '';
    return `<div class="wtl" title="胜 ${pct(r.winRate)} · 平 ${pct(r.tieRate)} · 负 ${pct(r.lossRate)}">${seg('w', r.winRate, '胜')}${seg('t', r.tieRate, '平')}${seg('l', r.lossRate, '负')}</div>`;
  }
  const simMeta = r => `<div class="sim-meta">
      <span>打死对手 <b>${pct(r.winLethal)}</b></span><span>被打死 <b>${pct(r.lossLethal)}</b></span>
      <span>赢时平均造成 <b>${r.avgDamageDealt || 0}</b></span><span>输时平均承受 <b>${r.avgDamageTaken || 0}</b></span>
      <span>${r.simulationCount || 0} 次模拟</span></div>`;

  function simHtml(s) {
    const sim = s.simulation;
    if (!sim) return '';
    if (!sim.available) return `<section class="panel"><h2>对战模拟</h2><div class="empty">Bob's Buddy 不可用：${esc(sim.message || '')}</div></section>`;

    // 本场 / 上一场（HDT 自带 Bob's Buddy 的结果）
    const lv = sim.live;
    let live;
    if (lv && lv.hasResult) {
      const title = s.phase === 'combat' && lv.turn === s.turn ? '本场战斗' : `第 ${lv.turn} 回合战斗（赛前预测）`;
      live = `<div class="sim-live"><span class="label">${title}</span><div>${wtlBar(lv)}${simMeta(lv)}</div></div>`;
    } else if (s.phase === 'combat') {
      live = `<div class="sim-live"><span class="label">本场战斗</span><div class="empty" style="padding:0">${lv && lv.errorState && lv.errorState !== 'None' ? 'Bob\'s Buddy：' + esc(lv.errorState) : '<span class="spin"></span> 等待 Bob\'s Buddy 结果…'}</div></div>`;
    } else live = '';

    // 对各个对手（上次见到的阵容）
    const mu = sim.matchups || { results: [] };
    const statusText = { waiting: '场面变化，稍后重新模拟…', running: '模拟中…', error: '模拟出错：' + esc(mu.error || '') }[mu.status] || '';
    const busy = sim.optimizer && sim.optimizer.status === 'running';
    const rows = (mu.results || []).map(r => `
      <div class="mu-row ${r.isNextOpponent ? 'next' : ''}">
        <span class="art" style="background-image:url('${ART(r.heroCardId)}')"></span>
        <span class="who"><div>${esc(r.heroName || r.heroCardId)}${r.isNextOpponent ? '<span class="tag-next">下个对手</span>' : ''}</div>
          <small>第 ${r.boardSeenTurn} 回合阵容 · ${r.opponentMinionCount} 随从</small></span>
        <span class="wtl-wrap">${r.error ? `<span class="empty" style="padding:0">${esc(r.error)}</span>` : wtlBar(r)}</span>
        <button class="btn" data-opt="${r.opponentPlayerId}" ${busy || r.error ? 'disabled' : ''}>优化站位</button>
      </div>`).join('');
    const matchups = s.phase === 'combat' ? '' : `
      <h2 style="margin-top:4px">对各对手（按上次见到的阵容）<span class="sub">${mu.status === 'running' || mu.status === 'waiting' ? '<span class="spin"></span> ' : ''}${statusText}</span></h2>
      ${rows ? `<div class="mu">${rows}</div>` : `<div class="empty">${esc(mu.error || '还没有和任何对手交过手')}</div>`}`;

    return `<section class="panel"><h2>对战模拟 <span class="sub">Bob's Buddy</span></h2>${live}${matchups}${optimizerHtml(s)}</section>`;
  }

  function optimizerHtml(s) {
    const o = s.simulation.optimizer;
    if (s.phase === 'combat' || !o || o.status === 'idle') return '';
    if (o.status === 'error') return `<div class="opt"><div class="opt-msg">站位优化：${esc(o.message || '失败')}</div></div>`;
    const board = (s.player && s.player.board) || [];
    const nameOf = id => (board.find(m => m.entityId === id) || {}).name || `#${id}`;
    const order = (o.bestOrder || []).map((id, i) =>
      `${i ? '<span class="arrow">›</span>' : ''}<span class="m ${o.currentOrder[i] !== id ? 'moved' : ''}">${esc(nameOf(id))}</span>`).join('');
    const head = `<div class="opt-head"><b>站位优化</b><span class="opt-msg">对 ${esc(o.opponentHeroName || '')}（第 ${o.boardSeenTurn} 回合阵容）</span>
      ${o.status === 'running' ? `<span class="sim-meta"><span class="spin"></span> 已试 ${o.evaluated} 种站位…</span>` : ''}</div>`;
    if (o.status === 'running')
      return `<div class="opt">${head}${order ? `<div class="sim-meta">目前最好：</div><div class="order">${order}</div>` : ''}</div>`;
    return `<div class="opt">${head}
      <div class="opt-msg" style="margin-bottom:8px">${esc(o.message || '')}</div>
      <div class="opt-cmp"><span>当前站位</span>${o.current ? wtlBar(o.current) : ''}<span>建议站位</span>${o.best ? wtlBar(o.best) : ''}</div>
      <div class="order"><span class="sim-meta" style="margin:0 6px 0 0">从左到右：</span>${order}</div>
      <div class="sim-meta">共试了 ${o.evaluated} 种站位；对手阵容是旧的，结果仅供参考。</div></div>`;
  }

  // 优化按钮（事件委托，面板每次重绘都有效）
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-opt]');
    if (!b) return;
    b.disabled = true;
    requestOptimize(+b.dataset.opt);
  });

  function render(s) {
    const p = s.player;
    const phaseEl = $('phase');
    phaseEl.textContent = PHASE[s.phase] || s.phase;
    phaseEl.className = 'pill ' + (s.phase || '');
    $('turn').textContent = s.turn || '—';
    $('health').innerHTML = p ? `${p.health}${p.armor ? `<small style="color:#9fb7c9;font-size:12px"> +${p.armor}</small>` : ''}` : '—';
    $('tier').innerHTML = p ? stars(p.tavernTier) : '—';
    $('gold').textContent = p ? `${p.gold}/${p.maxGold}` : '—';
    $('coins').innerHTML = p ? Array.from({ length: Math.min(p.maxGold, 10) }, (_, i) => `<span class="coin ${i < p.gold ? 'on' : ''}"></span>`).join('') : '';
    $('races').innerHTML = (s.availableRaces || []).map(r => `<span class="chip">${RACE[r] || r}</span>`).join('');

    const main = $('main');
    if (!s.inGame || !s.isBattlegrounds) {
      main.innerHTML = `<div class="panel center-msg"><b>${s.inGame ? '当前不是酒馆战旗对局' : '等待对局开始'}</b>进入酒馆战旗后，这里会实时显示局面。</div>`;
      return;
    }
    if (s.phase === 'hero_select' || !p) {
      main.innerHTML = `<div class="layout">
        <aside class="panel"><h2>排行榜</h2>${leaderboardHtml(s.leaderboard, s)}</aside>
        <div class="panel center-msg"><b>正在选择英雄</b>选好英雄后开始显示酒馆和场面。</div></div>`;
      return;
    }

    const top = s.phase === 'combat' && s.opponent
      ? `<section class="panel"><h2>对手场面 <span class="sub">${esc(s.opponent.heroName || '')} · ${s.opponent.health} 血 · ${s.opponent.tavernTier} 本</span></h2>
           ${rowHtml(s.opponent.board, '对手场上没有随从')}</section>`
      : `<section class="panel"><h2>鲍勃的酒馆 <span class="sub">${(s.tavern || []).filter(c => c.frozen).length ? '有冻结的随从' : ''}</span></h2>
           ${rowHtml(s.tavern, s.phase === 'recruit' ? '酒馆是空的' : '战斗中，酒馆不可见')}</section>`;

    const hps = (p.heroPowers || []).map(h => `
      <div class="hp-card ${h.used ? 'used' : ''}"><span class="art" style="background-image:url('${ART(h.cardId)}')"></span>
        <span><div>${esc(h.name || h.cardId)}</div><div class="c">${h.cost} 金币${h.used ? ' · 已使用' : ''}</div></span></div>`).join('');
    const extras = [...(p.trinkets || []), ...(p.questRewards || [])];

    main.innerHTML = `<div class="layout">
      <aside class="stack">
        <section class="panel"><h2>排行榜</h2>${leaderboardHtml(s.leaderboard, s)}</section>
        <section class="panel"><h2>英雄</h2>
          <div class="hp-card" style="border-radius:12px;margin-bottom:8px"><span class="art" style="width:44px;height:44px;background-image:url('${ART(p.heroCardId)}')"></span>
            <span><div><b>${esc(p.heroName || p.heroCardId)}</b></div><div class="c">第 ${p.leaderboardPlace || '?'} 名 · 下回合额外 ${p.extraGoldNextTurn || 0} 金</div></span></div>
          <div class="heropowers">${hps || '<span class="empty">无英雄技能</span>'}</div>
        </section>
      </aside>
      <div class="stack">
        ${top}
        <section class="panel"><h2>你的场面 <span class="sub">${p.board.length}/7 · 从左到右</span></h2>${rowHtml(p.board, '场上没有随从')}</section>
        ${simHtml(s)}
        <div class="split">
          <section class="panel"><h2>手牌 <span class="sub">${p.hand.length}/10</span></h2>${rowHtml(p.hand, '手牌为空', { showCost: true })}</section>
          <section class="panel"><h2>饰品 / 任务奖励</h2>${rowHtml(extras, '暂无')}</section>
        </div>
      </div>
    </div>`;
  }

  // ---------- 数据源 ----------
  let latest = null;
  function show(state, mode) {
    latest = state;
    render(state);
    $('raw').textContent = JSON.stringify(state, null, 2);
    $('seq').textContent = state.seq ? `#${state.seq}` : '';
    const pi = state.plugin;
    $('ver').textContent = pi && pi.version ? 'v' + pi.version : '';
    const ub = $('updateBanner');
    ub.hidden = !(pi && pi.updateReady);
    if (pi && pi.updateReady) ub.textContent = `新版本 ${pi.latestVersion} 已自动下载，重启 HDT（托盘图标右键退出后再打开）后生效。`;
    const dot = $('dot');
    dot.className = 'dot ' + (mode === 'live' ? 'ok' : mode === 'demo' ? 'demo' : '');
    $('connText').textContent = mode === 'live' ? '已连接 HDT' : mode === 'demo' ? '演示数据' : '未连接';
  }

  $('copyBtn').addEventListener('click', e => {
    e.preventDefault();
    if (latest) navigator.clipboard?.writeText(JSON.stringify(latest, null, 2));
  });

  const params = new URLSearchParams(location.search);
  const onServer = location.protocol.startsWith('http') && location.port === (params.get('port') || '8765');
  const base = params.get('server') || (onServer ? '' : 'http://localhost:8765');

  let demoMode = false;
  function requestOptimize(opponentId) {
    if (!demoMode) {
      fetch(base + '/optimize?opponent=' + opponentId, { cache: 'no-store' })
        .then(r => r.json())
        .then(r => { if (!r.accepted) alert(r.message || '无法开始优化'); })
        .catch(() => alert('请求失败：插件没有连接'));
      return;
    }
    const opp = DEMO.simulation.matchups.results.find(r => r.opponentPlayerId === opponentId) || {};
    const cur = DEMO.player.board.map(m => m.entityId);
    const best = [103, 101, 102, 104, 105, 106];
    const base0 = { winRate: opp.winRate, tieRate: opp.tieRate, lossRate: opp.lossRate, winLethal: 0, lossLethal: 0, avgDamageDealt: opp.avgDamageDealt, avgDamageTaken: opp.avgDamageTaken, simulationCount: 6000 };
    const o = { status: 'running', requestId: 1, opponentPlayerId: opponentId, opponentHeroName: opp.heroName, boardSeenTurn: opp.boardSeenTurn,
                currentOrder: cur, bestOrder: [], bestOrderNames: [], evaluated: 0 };
    DEMO.simulation.optimizer = o; show(DEMO, 'demo');
    let n = 0;
    const tick = setInterval(() => {
      n += 7; o.evaluated = n; if (n > 20) o.bestOrder = best;
      if (n >= 49) {
        clearInterval(tick);
        Object.assign(o, { status: 'done', evaluated: 49, bestOrder: best, current: base0,
          best: Object.assign({}, base0, { winRate: Math.min(0.97, base0.winRate + 0.064), lossRate: Math.max(0.01, base0.lossRate - 0.058), tieRate: base0.tieRate - 0.006 }),
          message: '调整后（胜率 - 负率）提升 12.2 个百分点' });
      }
      show(DEMO, 'demo');
    }, 350);
  }

  function showDemo(reason) {
    demoMode = true;
    const b = $('banner');
    b.hidden = false;
    b.innerHTML = reason;
    show(DEMO, 'demo');
  }

  if (params.has('demo')) {
    if (params.get('demo') === 'combat') {
      // 战斗阶段演示：酒馆隐藏，显示本回合对手
      DEMO.phase = 'combat';
      DEMO.tavern = [];
      DEMO.opponent = {
        heroCardId: 'TB_BaconShop_HERO_08', heroName: '伊利丹·怒风', health: 27, armor: 2, tavernTier: 4,
        board: [
          m({ entityId: 301, cardId: 'BGS_048', name: '南海船工', position: 1, attack: 9, health: 7, tier: 4, races: ['PIRATE'] }),
          m({ entityId: 302, cardId: 'BG26_135', name: '南海卖艺者', position: 2, attack: 6, health: 6, tier: 2, races: ['PIRATE'], windfury: true }),
          m({ entityId: 303, cardId: 'BG25_032', name: '佩吉·硬骨', position: 3, attack: 8, health: 10, tier: 4, races: ['PIRATE'], divineShield: true }),
          m({ entityId: 304, cardId: 'BGS_072', name: '霍加尔船长', position: 4, attack: 12, health: 12, tier: 6, races: ['PIRATE'], golden: true, taunt: true })
        ]
      };
      DEMO.simulation.live = { turn: 9, state: 'Combat', errorState: 'None', hasResult: true, winRate: 0.641, tieRate: 0.058, lossRate: 0.301,
        winLethal: 0, lossLethal: 0, avgDamageDealt: 10.6, avgDamageTaken: 8.0, simulationCount: 10000 };
    }
    showDemo('演示模式：显示的是示例数据（<code>?demo</code> 招募阶段，<code>?demo=combat</code> 战斗阶段）。去掉网址参数即连接 HDT。');
    return;
  }

  let failures = 0;
  function poll() {
    fetch(base + '/state.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(s => { failures = 0; demoMode = false; $('banner').hidden = true; show(s, 'live'); })
      .catch(() => {
        failures++;
        if (failures === 3) showDemo('连不上 HDT 插件（<code>' + esc(base || location.origin) + '</code>）。请确认 HDT 已打开并启用了 BG State Exporter 插件。下面先显示示例数据，连上后会自动切换。');
      })
      .finally(() => setTimeout(poll, failures ? 2000 : 1000));
  }

  if (window.EventSource) {
    const es = new EventSource(base + '/events');
    let gotEvent = false;
    es.onmessage = ev => { gotEvent = true; failures = 0; demoMode = false; $('banner').hidden = true; show(JSON.parse(ev.data), 'live'); };
    es.onerror = () => {
      if (!gotEvent) { es.close(); poll(); }      // 推送不可用就退回轮询
      else $('connText').textContent = '重连中…';
    };
  } else {
    poll();
  }
})();
</script>
</body>
</html>

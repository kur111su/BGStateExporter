<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战旗局面面板</title>
<style>
  :root {
    --paper: #ffffff;
    --rail: #f3f5f8;
    --ink: #172033;
    --muted: #5e6878;
    --faint: #8a93a3;
    --rule: #dde2ea;
    --rule-soft: #ebeef3;
    --mana: #1d5fd1;
    --mana-soft: #e8effc;
    --gold: #b7790a;
    --gold-soft: #fbf3e2;
    --win: #178a4e;
    --win-soft: #e5f4ec;
    --tie: #9aa3b2;
    --loss: #c73c3c;
    --loss-soft: #fbe9e9;
    --frost: #1b8fc7;
    --frost-soft: #e4f3fb;
    --radius-s: 6px;
    --radius-m: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 "Microsoft YaHei UI", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--mana); outline-offset: 2px; }

  /* ---------- 顶栏 ---------- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }
  .bar-in {
    max-width: 1440px; margin: 0 auto; padding: 10px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
  }
  .title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }
  .dot.ok { background: var(--win); }
  .dot.demo { background: var(--gold); }
  .phase { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--rail); color: var(--muted); }
  .phase.recruit { background: var(--mana-soft); color: var(--mana); }
  .phase.combat { background: var(--loss-soft); color: var(--loss); }
  .kv { display: inline-flex; align-items: baseline; gap: 6px; }
  .kv .k { font-size: 12px; color: var(--muted); }
  .kv .v { font-size: 18px; font-weight: 700; }
  .kv .v small { font-size: 12px; font-weight: 400; color: var(--frost); }
  .tier-pips { display: inline-flex; gap: 3px; vertical-align: 2px; }
  .tier-pips i { width: 9px; height: 9px; border-radius: 2px; background: var(--rule); transform: rotate(45deg); }
  .tier-pips i.on { background: var(--gold); }
  .coins { display: inline-flex; gap: 2px; vertical-align: 1px; }
  .coins i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #d9c7a0; background: #fff; }
  .coins i.on { background: var(--gold); border-color: var(--gold); }
  .bar .spacer { flex: 1; }
  .races { display: flex; flex-wrap: wrap; gap: 4px; }
  .race { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
  .ver { font-size: 12px; color: var(--faint); }

  .notice { max-width: 1440px; margin: 12px auto 0; padding: 0 16px; }
  .notice:has(> [hidden]) { display: none; }
  .notice > div { border-radius: var(--radius-s); padding: 8px 12px; font-size: 13px; }
  .notice .warn { background: var(--gold-soft); color: #7a5208; }
  .notice .info { background: var(--mana-soft); color: var(--mana); }
  .notice code { background: rgba(0,0,0,.05); padding: 0 4px; border-radius: 3px; }

  /* ---------- 主体 ---------- */
  .page {
    max-width: 1440px; margin: 0 auto; padding: 16px 16px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px;
  }
  @media (max-width: 1080px) { .page { grid-template-columns: minmax(0, 1fr); } }
  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; min-width: 0; align-content: start; }
  .rail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; min-width: 0; }
  .block > h2 {
    font-size: 15px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .block > h2 .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
  .rail .card-box { background: var(--rail); border-radius: var(--radius-m); padding: 14px; }
  .rail h3 { margin: 0 0 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; }
  .rail h3 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  .empty { color: var(--faint); font-size: 13px; padding: 8px 0; }
  .center { text-align: center; padding: 80px 20px; color: var(--muted); }
  .center b { display: block; font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* ---------- 胜平负条 ---------- */
  .wtl { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule-soft); }
  .wtl i { display: block; height: 100%; }
  .wtl .w { background: var(--win); } .wtl .t { background: var(--tie); } .wtl .l { background: var(--loss); }
  .wtl-label { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; color: var(--muted); }
  .wtl-label .w { color: var(--win); font-weight: 700; } .wtl-label .l { color: var(--loss); font-weight: 700; }
  .wtl.big { height: 14px; border-radius: 7px; }

  /* ---------- 建议 ---------- */
  .advice { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .advice { grid-template-columns: minmax(0, 1fr); } }
  .plan { border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 14px 16px; min-width: 0; background: var(--paper); }
  .plan.best { border: 2px solid var(--mana); padding: 13px 15px; }
  .plan-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .plan-head b { font-size: 15px; }
  .plan.best .plan-head b { color: var(--mana); }
  .plan-head .score { margin-left: auto; font-size: 13px; color: var(--muted); }
  .plan-head .score strong { color: var(--ink); font-size: 16px; }
  .alts { display: grid; gap: 14px; align-content: start; }
  .steps { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .steps li { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: baseline; }
  .plan.best .steps li { font-size: 15px; }
  .alts .steps li { font-size: 13px; }
  .op { font-size: 12px; font-weight: 700; text-align: center; border-radius: 4px; line-height: 20px; background: var(--rail); color: var(--muted); }
  .op.buy { background: var(--win-soft); color: var(--win); }
  .op.sell { background: var(--loss-soft); color: var(--loss); }
  .op.upgrade { background: var(--gold-soft); color: var(--gold); }
  .op.freeze { background: var(--frost-soft); color: var(--frost); }
  .op.spell { background: #efe8fb; color: #6a3fb5; }
  .op.keep { background: var(--rail); color: var(--muted); }

  /* ---------- 回合记录 ---------- */
  .tl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tl th, .tl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  .tl th { font-size: 12px; font-weight: 400; color: var(--muted); background: var(--rail); border-bottom: 1px solid var(--rule); }
  .tl td.t { white-space: nowrap; color: var(--muted); }
  .tl td.t b { color: var(--ink); }
  .tl .m { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; line-height: 18px; white-space: nowrap; }
  .tl .m.same { background: var(--win-soft); color: var(--win); }
  .tl .m.partial { background: var(--gold-soft); color: var(--gold); }
  .tl .m.diff { background: var(--loss-soft); color: var(--loss); }
  .tl .m.none { background: var(--rail); color: var(--faint); }
  .tl tr.now td { background: #f7f9fe; }
  .tl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius-m); }
  .tl-sum { font-size: 12px; color: var(--muted); }
  .steps .g { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .reasons { margin: 10px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .advice-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .advice-meta b { color: var(--ink); }

  /* ---------- 决策账本 ---------- */
  .ledger-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius-m); }
  table.ledger { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 13px; }
  .ledger th, .ledger td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
  .ledger thead th { font-size: 12px; font-weight: 400; color: var(--muted); background: var(--rail); border-bottom: 1px solid var(--rule); }
  .ledger thead th.p1 { color: var(--mana); font-weight: 700; }
  .ledger td.feat { font-weight: 700; white-space: nowrap; }
  .ledger td.feat small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
  .ledger td.wt { white-space: nowrap; }
  .ledger td.wt .d { font-size: 11px; color: var(--faint); }
  .ledger td.wt .d.up { color: var(--win); } .ledger td.wt .d.down { color: var(--loss); }
  .ledger td.cell { min-width: 150px; }
  .ledger td.cell.p1 { background: #f7f9fe; }
  .calc { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .pts { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: center; }
  .pts b { text-align: right; font-size: 13px; }
  .pts b.pos { color: var(--ink); } .pts b.neg { color: var(--loss); } .pts b.zero { color: var(--faint); font-weight: 400; }
  .div-bar { position: relative; height: 8px; }
  .div-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--rule); }
  .div-bar i { position: absolute; top: 0; height: 100%; border-radius: 2px; }
  .div-bar i.pos { left: 50%; background: var(--mana); }
  .div-bar i.neg { right: 50%; background: var(--loss); }
  .ledger tfoot td { font-weight: 700; border-bottom: 0; background: var(--rail); }
  .ledger tfoot td.cell.p1 { background: var(--mana-soft); color: var(--mana); }
  .ledger-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ---------- 卡牌 ---------- */
  .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .card { width: 92px; text-align: center; position: relative; }
  .portrait {
    width: 92px; height: 112px; margin: 0 auto; position: relative;
    border-radius: 46px 46px 38px 38px / 54px 54px 40px 40px;
    background: var(--rail) center 28% / 165% no-repeat;
    border: 2px solid var(--rule);
  }
  .card.spell .portrait { border-radius: 10px; height: 104px; border-color: #c7d4ee; }
  .card.golden .portrait { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
  .card.taunt .portrait { outline: 4px solid #c9ced8; outline-offset: 1px; border-radius: 16px 16px 38px 38px; }
  .card.ds .portrait::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid #f0c94a; pointer-events: none; }
  .card.frozen .portrait::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(27,143,199,.28); }
  .card.mark-buy .portrait { box-shadow: 0 0 0 3px var(--win); }
  .card.mark-sell .portrait { box-shadow: 0 0 0 3px var(--loss); }
  .mark-tag { position: absolute; top: 4px; right: 0; font-size: 11px; font-weight: 700; color: #fff; padding: 0 6px; border-radius: 999px; z-index: 3; }
  .mark-buy .mark-tag { background: var(--win); }
  .mark-sell .mark-tag { background: var(--loss); }
  .tier { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--rule); border-radius: 999px; padding: 0 6px; font-size: 11px; color: var(--gold); font-weight: 700; z-index: 2; white-space: nowrap; }
  .badge { position: absolute; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; border: 2px solid #fff; z-index: 2; }
  .badge.atk { left: -2px; background: #d39a12; }
  .badge.hp { right: -2px; background: var(--loss); }
  .badge.cost { left: -2px; top: -6px; bottom: auto; background: var(--mana); }
  .name { margin-top: 10px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: var(--faint); min-height: 16px; }
  .kw { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 2px; }
  .kw span { font-size: 10px; padding: 0 4px; border-radius: 3px; line-height: 15px; background: var(--rail); color: var(--muted); }
  .kw .k-ds { background: #fdf5d6; color: #8a6a00; }
  .kw .k-ven { background: #e8f5e2; color: #3d7a2a; }
  .kw .k-reb { background: #e6f4f8; color: #2a6f86; }
  .kw .k-frz { background: var(--frost-soft); color: var(--frost); }
  .board-split { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; }
  @media (max-width: 760px) { .board-split { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- 对战模拟 ---------- */
  .mu { display: grid; gap: 2px; }
  .mu-row { display: grid; grid-template-columns: 32px minmax(110px, 170px) 1fr auto; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule-soft); }
  .mu-row.next .who b::after { content: "下个对手"; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--mana); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--rail) center/cover no-repeat; border: 1px solid var(--rule); }
  .who { font-size: 13px; min-width: 0; }
  .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { color: var(--faint); font-size: 11px; }
  @media (max-width: 640px) { .mu-row { grid-template-columns: 32px 1fr auto; } .mu-row .bar-cell { grid-column: 1 / -1; } }
  .btn { border: 1px solid var(--rule); background: #fff; color: var(--ink); border-radius: var(--radius-s); padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--mana); color: var(--mana); }
  .btn:disabled { opacity: .45; cursor: default; color: var(--muted); border-color: var(--rule); }
  .opt { margin-top: 14px; padding: 12px 14px; background: var(--rail); border-radius: var(--radius-m); font-size: 13px; }
  .opt-cmp { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; align-items: center; margin: 8px 0; font-size: 12px; color: var(--muted); }
  .order { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .order span { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
  .order span.moved { border-color: var(--mana); color: var(--mana); }
  .live { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: end; }
  .live .big-num { font-size: 34px; font-weight: 800; line-height: 1; color: var(--win); }
  .live .big-num.bad { color: var(--loss); }
  .live .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  .live .facts b { color: var(--ink); }

  /* ---------- 右栏 ---------- */
  .lb { display: grid; gap: 4px; }
  .lb-row { display: grid; grid-template-columns: 16px 30px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: var(--radius-s); }
  .lb-row.me { background: #fff; box-shadow: inset 0 0 0 1px var(--rule); }
  .lb-row.next { box-shadow: inset 3px 0 0 var(--mana); }
  .lb-row.dead { opacity: .4; }
  .lb-row .pl { font-size: 12px; color: var(--muted); text-align: center; }
  .lb-row .avatar { width: 30px; height: 30px; }
  .lb-row .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-row .nm small { display: block; font-size: 11px; color: var(--faint); }
  .lb-row .hp { font-weight: 700; text-align: right; font-size: 13px; }
  .lb-row .hp small { display: block; font-weight: 400; font-size: 11px; color: var(--frost); }
  .hero { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .hero .avatar { width: 40px; height: 40px; }
  .hero small { display: block; color: var(--muted); font-size: 12px; }
  .hp-list { display: grid; gap: 6px; }
  .hp-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .hp-item.used { opacity: .45; }
  .hp-item .avatar { width: 26px; height: 26px; }
  .hp-item small { color: var(--muted); }
  .weights { display: grid; gap: 7px; }
  .w-row { display: grid; grid-template-columns: 64px 1fr 52px; gap: 8px; align-items: center; font-size: 12px; }
  .w-row .val { text-align: right; font-weight: 700; }
  .w-row .val small { display: block; font-weight: 400; color: var(--faint); font-size: 10px; }
  .w-row .val small.up { color: var(--win); } .w-row .val small.down { color: var(--loss); }
  .w-track { position: relative; height: 6px; background: #fff; border-radius: 3px; }
  .w-track i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; background: var(--mana); }
  .w-track b { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink); opacity: .35; }
  .learn { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .learn .prog { height: 6px; background: #fff; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .learn .prog i { display: block; height: 100%; background: var(--win); }
  .learn b { color: var(--ink); }
  details.raw summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  details.raw pre { max-height: 360px; overflow: auto; font: 11px/1.5 Consolas, "Cascadia Mono", monospace; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 8px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--rule); border-top-color: var(--mana); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <span class="title">战旗局面 <span class="conn"><span id="dot" class="dot"></span><span id="connText">连接中…</span></span></span>
  <span id="phase" class="phase">—</span>
  <span class="kv"><span class="k">回合</span><span class="v" id="turn">—</span></span>
  <span class="kv"><span class="k">血量</span><span class="v" id="health">—</span></span>
  <span class="kv"><span class="k">酒馆</span><span class="v" id="tier">—</span></span>
  <span class="kv"><span class="k">金币</span><span class="v" id="gold">—</span><span class="coins" id="coins"></span></span>
  <span class="spacer"></span>
  <span class="races" id="races"></span>
  <span class="ver" id="ver"></span>
</div></header>

<div class="notice"><div id="banner" class="warn" hidden></div></div>
<div class="notice"><div id="updateBanner" class="info" hidden></div></div>

<div id="root"></div>

<div class="page" style="padding-top:0"><div></div><div>
  <details class="raw"><summary>原始 JSON <span id="seq"></span> · <a href="#" id="copyBtn">复制</a></summary><pre id="raw">{}</pre></details>
</div></div>

<script>
(() => {
  const ART = id => `https://art.hearthstonejson.com/v1/256x/${encodeURIComponent(id)}.jpg`;
  const RACE = {
    BEAST: '野兽', DEMON: '恶魔', DRAGON: '龙', ELEMENTAL: '元素', MECHANICAL: '机械',
    MURLOC: '鱼人', PIRATE: '海盗', QUILBOAR: '野猪人', NAGA: '纳迦', UNDEAD: '亡灵', ALL: '全部'
  };
  const PHASE = {
    menu: '未在对局', not_battlegrounds: '非战旗对局', hero_select: '选择英雄',
    recruit: '招募阶段', combat: '战斗阶段', game_over: '对局结束'
  };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = v => `${Math.round((v || 0) * 100)}%`;
  const num = (v, d = 2) => (v || 0).toFixed(d);

  // ---------- 演示数据（未连接 HDT 时显示） ----------
  const m = (o) => Object.assign({ type: 'minion', races: [], golden: false, taunt: false, divineShield: false, poisonous: false,
    venomous: false, reborn: false, windfury: false, stealth: false, deathrattle: false, frozen: false, cost: 3 }, o);

  // ---------- 小组件 ----------
  function wtl(r, big) {
    const seg = (cls, v) => v > 0.001 ? `<i class="${cls}" style="width:${v * 100}%"></i>` : '';
    return `<div class="wtl ${big ? 'big' : ''}" role="img" aria-label="胜 ${pct(r.winRate)}，平 ${pct(r.tieRate)}，负 ${pct(r.lossRate)}">${seg('w', r.winRate)}${seg('t', r.tieRate)}${seg('l', r.lossRate)}</div>
      <div class="wtl-label"><span class="w">胜 ${pct(r.winRate)}</span><span>平 ${pct(r.tieRate)}</span><span class="l">负 ${pct(r.lossRate)}</span></div>`;
  }

  function cardHtml(c, opts = {}) {
    const cls = ['card', c.type === 'spell' ? 'spell' : 'minion'];
    if (c.golden) cls.push('golden');
    if (c.taunt) cls.push('taunt');
    if (c.divineShield) cls.push('ds');
    if (c.frozen) cls.push('frozen');
    const kws = [];
    if (c.divineShield) kws.push(['k-ds', '圣盾']);
    if (c.taunt) kws.push(['', '嘲讽']);
    if (c.venomous) kws.push(['k-ven', '烈毒']);
    if (c.poisonous) kws.push(['k-ven', '剧毒']);
    if (c.reborn) kws.push(['k-reb', '复生']);
    if (c.windfury) kws.push(['', '风怒']);
    if (c.deathrattle) kws.push(['', '亡语']);
    if (c.stealth) kws.push(['', '潜行']);
    if (c.frozen) kws.push(['k-frz', '冻结']);
    const races = (c.races || []).map(r => RACE[r] || r).join(' / ');
    const minion = c.type === 'minion';
    return `<div class="${cls.join(' ')}" data-eid="${c.entityId}" title="${esc(c.name)} · ${esc(c.cardId)}">
        <div class="portrait" style="background-image:url('${ART(c.cardId)}')">
          ${c.tier ? `<span class="tier">${c.tier} 星</span>` : ''}
          ${opts.showCost || c.type === 'spell' ? `<span class="badge cost">${c.cost}</span>` : ''}
          ${minion ? `<span class="badge atk">${c.attack}</span><span class="badge hp">${c.health}</span>` : ''}
        </div>
        <div class="name">${esc(c.name || c.cardId)}</div>
        <div class="meta">${esc(races || (c.type === 'spell' ? '法术' : ''))}</div>
        <div class="kw">${kws.map(([k, t]) => `<span class="${k}">${t}</span>`).join('')}</div>
      </div>`;
  }
  const row = (cards, empty, opts) => cards && cards.length
    ? `<div class="row">${cards.map(c => cardHtml(c, opts)).join('')}</div>` : `<div class="empty">${empty}</div>`;

  // ---------- 本回合建议 ----------
  const OP = { upgrade: '升本', sell: '卖', buy: '买', spell: '法术', play: '打出', keep: '留手', refresh: '刷新', freeze: '冻结', pass: '跳过' };
  function planHtml(pl, best) {
    return `<div class="plan ${best ? 'best' : ''}">
      <div class="plan-head"><b>${best ? '推荐' : '备选 ' + (pl.rank - 1)}</b><span class="score">得分 <strong>${num(pl.score)}</strong></span></div>
      <ol class="steps">${pl.steps.map(st => `<li><span class="op ${st.type}">${OP[st.type] || st.type}</span><span>${esc(st.text)}</span><span class="g">剩 ${st.gold} 金</span></li>`).join('')}</ol>
      ${pl.sim ? wtl(pl.sim) : ''}
      ${best && pl.reasons && pl.reasons.length ? `<ul class="reasons">${pl.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    </div>`;
  }

  function adviceHtml(s) {
    const a = s.simulation && s.simulation.advisor;
    if (!a) return '';
    const busy = a.status === 'waiting' || a.status === 'running';
    const plans = a.plans || [];
    const shop = s.player && s.player.shop;
    const head = `<h2>本回合建议 <span class="sub">${busy ? '<span class="spin"></span> 计算中' : a.status === 'error' ? '出错：' + esc(a.message || '') : `枚举 ${a.plansConsidered} 种，模拟 ${a.plansSimulated} 种，用时 ${(a.elapsedMs / 1000).toFixed(1)} 秒`}</span></h2>`;
    if (!plans.length)
      return `<section class="block">${head}<div class="empty">${busy ? '正在计算这回合的方案…' : '这回合没有可用的方案'}</div></section>`;
    const meta = `<div class="advice-meta">
        ${a.targetHeroName ? `<span>按 <b>${esc(a.targetHeroName)}</b> 第 ${a.targetBoardSeenTurn} 回合的阵容模拟</span>` : ''}
        ${shop ? `<span>购买 <b>${shop.buyCost}</b> 金，刷新 <b>${shop.refreshCost}</b> 金${shop.freeRefreshes ? `（免费 ${shop.freeRefreshes} 次）` : ''}，升本 <b>${shop.canUpgrade ? shop.upgradeCost + ' 金' : '不可'}</b></span>` : ''}
        ${a.message ? `<span>${esc(a.message)}</span>` : ''}</div>`;
    return `<section class="block">${head}
      <div class="advice">${planHtml(plans[0], true)}<div class="alts">${plans.slice(1).map(p => planHtml(p, false)).join('')}</div></div>
      ${meta}</section>`;
  }

  // ---------- 决策账本：每项特征 × 权重 = 得分 ----------
  const FEAT_HELP = {
    sim: '胜率 − 负率（含伤害），乘血量系数',
    heur: '没有对手阵容时，按随从估值',
    upgrade: '升本时：落后节奏几级',
    behind: '不升本时：落后几级（负数）',
    triple: '这套操作凑成几个三连',
    pair: '新凑成几个对子',
    tribe: '买了几个主种族随从',
    effect: '买的随从里有效果的（按星级折算）',
    buys: '买了几个随从',
    spell: '买酒馆法术（按星级折算）',
    refresh: '剩下的金币够刷新几次',
  };
  function ledgerHtml(s) {
    const a = s.simulation && s.simulation.advisor;
    if (!a || !(a.plans || []).length || !(a.weights || []).length) return '';
    const plans = a.plans;
    const used = a.weights.filter(w => plans.some(p => p.features && Math.abs(p.features[w.key] || 0) > 1e-9));
    const parts = plans.map(p => used.map(w => w.value * ((p.features || {})[w.key] || 0)));
    const maxAbs = Math.max(0.05, ...parts.flat().map(Math.abs));
    const bar = v => {
      const width = Math.min(50, Math.abs(v) / maxAbs * 50);
      return v ? `<div class="div-bar"><i class="${v > 0 ? 'pos' : 'neg'}" style="width:${width}%"></i></div>` : '<div class="div-bar"></div>';
    };
    const head = `<tr><th>特征</th><th>权重</th>${plans.map((p, i) => `<th class="${i === 0 ? 'p1' : ''}">${i === 0 ? '推荐' : '备选 ' + i}</th>`).join('')}</tr>`;
    const body = used.map((w, wi) => {
      const d = w.value - w.default;
      const dTxt = Math.abs(d) > 1e-6 ? `<span class="d ${d > 0 ? 'up' : 'down'}">默认 ${num(w.default, 3)}</span>` : '<span class="d">默认值</span>';
      return `<tr><td class="feat">${esc(w.name)}<small>${FEAT_HELP[w.key] || ''}</small></td>
        <td class="wt">${num(w.value, 3)}<br>${dTxt}</td>
        ${plans.map((p, i) => {
          const f = (p.features || {})[w.key] || 0;
          const v = parts[i][wi];
          const cls = Math.abs(v) < 1e-9 ? 'zero' : v > 0 ? 'pos' : 'neg';
          return `<td class="cell ${i === 0 ? 'p1' : ''}"><div class="pts"><b class="${cls}">${v > 0 ? '+' : ''}${num(v)}</b>${bar(v)}</div>
            <div class="calc">${f ? `${num(w.value, 3)} × ${+f.toFixed(3)}` : '—'}</div></td>`;
        }).join('')}</tr>`;
    }).join('');
    const foot = `<tr><td colspan="2">总分</td>${plans.map((p, i) => `<td class="cell ${i === 0 ? 'p1' : ''}">${num(p.score)}</td>`).join('')}</tr>`;
    const notes = [];
    if (a.desiredTier) notes.push(`升本节奏：第 ${s.turn} 回合建议 ${a.desiredTier} 本，当前 ${s.player ? s.player.tavernTier : '?'} 本`);
    if (a.hpFactor) notes.push(`血量系数 ${num(a.hpFactor)}（血越少越大，已乘进战力）`);
    if (a.runnerUps) notes.push(`另有 ${a.runnerUps} 个方案得分更低，没有列出`);
    return `<section class="block"><h2>决策依据 <span class="sub">每一格 = 权重 × 特征值，加起来就是方案得分</span></h2>
      <div class="ledger-wrap"><table class="ledger"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
      <div class="ledger-note">${notes.map(esc).join('；')}</div></section>`;
  }

  // ---------- 对战模拟 ----------
  function liveHtml(s) {
    const lv = s.simulation && s.simulation.live;
    if (s.phase !== 'combat') return '';
    if (!lv || !lv.hasResult)
      return `<section class="block"><h2>本场战斗</h2><div class="empty">${lv && lv.errorState && lv.errorState !== 'None' ? 'Bob\'s Buddy：' + esc(lv.errorState) : '<span class="spin"></span> 等待 Bob\'s Buddy 结果'}</div></section>`;
    return `<section class="block"><h2>本场战斗 <span class="sub">Bob's Buddy，${lv.simulationCount} 次模拟</span></h2>
      <div class="live"><div>${wtl(lv, true)}</div><div class="big-num ${lv.winRate < lv.lossRate ? 'bad' : ''}">${pct(lv.winRate)}</div>
        <div class="facts"><span>打死对手 <b>${pct(lv.winLethal)}</b></span><span>被打死 <b>${pct(lv.lossLethal)}</b></span>
        <span>赢时平均造成 <b>${lv.avgDamageDealt}</b></span><span>输时平均承受 <b>${lv.avgDamageTaken}</b></span></div></div></section>`;
  }

  function matchupsHtml(s) {
    const sim = s.simulation;
    if (!sim || s.phase !== 'recruit') return '';
    if (!sim.available) return `<section class="block"><h2>对各对手</h2><div class="empty">Bob's Buddy 不可用：${esc(sim.message || '')}</div></section>`;
    const mu = sim.matchups || { results: [] };
    const busy = sim.optimizer && sim.optimizer.status === 'running';
    const status = { waiting: '场面变了，稍后重算', running: '计算中', error: '出错：' + esc(mu.error || '') }[mu.status] || '';
    const rows = (mu.results || []).map(r => `
      <div class="mu-row ${r.isNextOpponent ? 'next' : ''}">
        <span class="avatar" style="background-image:url('${ART(r.heroCardId)}')"></span>
        <span class="who"><b>${esc(r.heroName || r.heroCardId)}</b><small>第 ${r.boardSeenTurn} 回合的阵容，${r.opponentMinionCount} 个随从</small></span>
        <span class="bar-cell">${r.error ? `<span class="empty">${esc(r.error)}</span>` : wtl(r)}</span>
        <button class="btn" data-opt="${r.opponentPlayerId}" ${busy || r.error ? 'disabled' : ''}>优化站位</button>
      </div>`).join('');
    const lv = sim.live;
    const prev = lv && lv.hasResult ? `<div class="ledger-note" style="margin-bottom:8px">上回合战斗的赛前预测：胜 ${pct(lv.winRate)}，负 ${pct(lv.lossRate)}</div>` : '';
    return `<section class="block"><h2>对各对手 <span class="sub">用你现在的场面，对每个对手上次的阵容模拟${status ? '。' + status : ''}</span></h2>
      ${prev}${rows ? `<div class="mu">${rows}</div>` : `<div class="empty">${esc(mu.error || '还没有和任何对手交过手')}</div>`}
      ${optimizerHtml(s)}</section>`;
  }

  function optimizerHtml(s) {
    const o = s.simulation.optimizer;
    if (!o || o.status === 'idle') return '';
    if (o.status === 'error') return `<div class="opt">站位优化：${esc(o.message || '失败')}</div>`;
    const board = (s.player && s.player.board) || [];
    const nameOf = id => (board.find(m => m.entityId === id) || {}).name || `#${id}`;
    const order = (o.bestOrder || []).map((id, i) => `<span class="${o.currentOrder[i] !== id ? 'moved' : ''}">${esc(nameOf(id))}</span>`).join('');
    const head = `<b>站位优化</b>：对 ${esc(o.opponentHeroName || '')}（第 ${o.boardSeenTurn} 回合阵容）`;
    if (o.status === 'running')
      return `<div class="opt">${head}　<span class="spin"></span> 已试 ${o.evaluated} 种站位${order ? `<div class="order" style="margin-top:8px">目前最好：${order}</div>` : ''}</div>`;
    return `<div class="opt">${head}<div style="margin-top:4px">${esc(o.message || '')}</div>
      <div class="opt-cmp"><span>当前站位</span><div>${o.current ? wtl(o.current) : ''}</div><span>建议站位</span><div>${o.best ? wtl(o.best) : ''}</div></div>
      <div class="order">从左到右：${order}</div></div>`;
  }

  // ---------- 本局回合记录：回合开始时推荐了什么 / 你实际做了什么 ----------
  const MATCH = { same: '一致', partial: '部分一致', diff: '不同', none: '没有建议' };
  function turnLogHtml(s) {
    const log = (s.turnLog || []).slice().sort((a, b) => b.turn - a.turn);
    if (!log.length) return '';
    const judged = log.filter(r => r.match !== 'none');
    const same = judged.filter(r => r.match === 'same').length;
    const upAgree = judged.filter(r => r.adviceUpgrade === r.actualUpgrade).length;
    const rows = log.map(r => `<tr class="${r.turn === s.turn ? 'now' : ''}">
        <td class="t"><b>${r.turn}</b> 回合<br>${r.tier} 本</td>
        <td>${esc(r.advice || '—')}</td>
        <td>${esc(r.actual)}</td>
        <td><span class="m ${r.match}">${MATCH[r.match] || r.match}</span></td></tr>`).join('');
    return `<section class="block"><h2>本局回合记录 <span class="sub">推荐 = 每回合酒馆刷出来后的第一份建议</span></h2>
      ${judged.length ? `<div class="tl-sum" style="margin-bottom:8px">${judged.length} 个回合里，和推荐完全一致 ${same} 个；升不升本一致 ${upAgree} 个</div>` : ''}
      <div class="tl-wrap"><table class="tl"><thead><tr><th>回合</th><th>推荐</th><th>你的操作</th><th>对比</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  // ---------- 右栏 ----------
  function leaderboardHtml(s) {
    const lb = s.leaderboard || [];
    if (!lb.length) return '<div class="empty">暂无排行榜数据</div>';
    const vs = s.opponent && s.opponent.heroCardId;
    return `<div class="lb">${lb.map(e => {
      const next = !e.isPlayer && ((s.phase !== 'combat' && e.playerId && e.playerId === s.nextOpponentPlayerId) || (vs && e.heroCardId === vs));
      return `<div class="lb-row ${e.isPlayer ? 'me' : ''} ${e.dead ? 'dead' : ''} ${next ? 'next' : ''}">
        <span class="pl">${e.place}</span><span class="avatar" style="background-image:url('${ART(e.heroCardId)}')"></span>
        <span class="nm">${esc(e.heroName || e.heroCardId)}${e.isPlayer ? '（你）' : ''}<small>${e.tavernTier || '?'} 本${next ? (s.phase === 'combat' ? '，正在交战' : '，下个对手') : ''}</small></span>
        <span class="hp">${e.dead ? '出局' : e.health}${e.armor ? `<small>+${e.armor} 甲</small>` : ''}</span></div>`;
    }).join('')}</div>`;
  }

  function heroHtml(p) {
    const hps = (p.heroPowers || []).map(h => `<div class="hp-item ${h.used ? 'used' : ''}"><span class="avatar" style="background-image:url('${ART(h.cardId)}')"></span>
        <span>${esc(h.name || h.cardId)} <small>${h.cost} 金${h.used ? '，已用' : ''}</small></span></div>`).join('');
    return `<div class="hero"><span class="avatar" style="background-image:url('${ART(p.heroCardId)}')"></span>
      <span><b>${esc(p.heroName || p.heroCardId)}</b><small>第 ${p.leaderboardPlace || '?'} 名，下回合额外 ${p.extraGoldNextTurn || 0} 金</small></span></div>
      <div class="hp-list">${hps || '<span class="empty">无英雄技能</span>'}</div>`;
  }

  function weightsHtml(s) {
    const a = s.simulation && s.simulation.advisor;
    const ws = (a && a.weights) || [];
    const l = s.learning;
    if (!ws.length && !l) return '';
    const max = Math.max(...ws.map(w => Math.max(w.value, w.default)), 0.01);
    const rows = ws.map(w => {
      const d = w.value - w.default;
      return `<div class="w-row"><span>${esc(w.name)}</span>
        <span class="w-track"><i style="width:${w.value / max * 100}%"></i><b style="left:${w.default / max * 100}%" title="默认 ${w.default}"></b></span>
        <span class="val">${num(w.value, 3)}${Math.abs(d) > 1e-6 ? `<small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${num(d, 3)}</small>` : ''}</span></div>`;
    }).join('');
    let learn = '';
    if (l) {
      if (!l.enabled) learn = '<div class="learn">自动学习已关闭（advisor_weights.json 里的“自动学习”）</div>';
      else {
        const p = Math.min(1, l.gamesCollected / Math.max(1, l.minGames));
        learn = `<div class="learn">${l.gamesCollected < l.minGames
          ? `已收集 <b>${l.gamesCollected}</b> / ${l.minGames} 局，攒够后每局结束自动调整权重`
          : `已收集 <b>${l.gamesCollected}</b> 局${l.fitting ? '，<span class="spin"></span> 正在调整' : ''}`}
          <div class="prog"><i style="width:${p * 100}%"></i></div>
          本局已记录 ${l.samplesThisGame} 次选择${l.lastFitMessage ? `<br>上次调整（${esc(l.lastFitTime || '')}）：${esc(l.lastFitMessage)}` : ''}</div>`;
      }
    }
    return `<div class="card-box"><h3>建议器权重 <span class="sub">竖线 = 默认值</span></h3><div class="weights">${rows || '<span class="empty">算出第一个方案后显示</span>'}</div>${learn}</div>`;
  }

  // 推荐方案涉及的卡牌：要买的标绿，要卖的标红
  function markBestPlan(s) {
    const a = s.simulation && s.simulation.advisor;
    const best = a && s.phase === 'recruit' && (a.plans || [])[0];
    if (!best) return;
    for (const st of best.steps) {
      if (!st.entityId || !['buy', 'sell', 'spell'].includes(st.type)) continue;
      const kind = st.type === 'sell' ? 'sell' : 'buy';
      document.querySelectorAll(`[data-eid="${st.entityId}"]`).forEach(el => {
        el.classList.add('mark-' + kind);
        el.insertAdjacentHTML('afterbegin', `<span class="mark-tag">${kind === 'buy' ? '买' : '卖'}</span>`);
      });
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-opt]');
    if (!b) return;
    b.disabled = true;
    requestOptimize(+b.dataset.opt);
  });

  // ---------- 整页 ----------
  const OFFER = { hero: '选英雄', hero_power: '选英雄技能', trinket: '选饰品', dark_gift: '黑暗之赐', discover: '发现', discover_spell: '发现法术', other: '待选择' };
  function offeredHtml(s) {
    const o = s.offered;
    if (!o || !o.cards || !o.cards.length) return '';
    return `<section class="block"><h2>${OFFER[o.kind] || '待选择'} <span class="sub">${o.cards.length} 个候选项（v0.9 起记录，供以后的模型推荐）</span></h2>${row(o.cards, '')}</section>`;
  }

  function render(s) {
    const p = s.player;
    const ph = $('phase');
    ph.textContent = PHASE[s.phase] || s.phase || '—';
    ph.className = 'phase ' + (s.phase || '');
    $('turn').textContent = s.turn || '—';
    $('health').innerHTML = p ? `${p.health}${p.armor ? `<small> +${p.armor}</small>` : ''}` : '—';
    $('tier').innerHTML = p ? `${p.tavernTier} <span class="tier-pips">${Array.from({ length: 6 }, (_, i) => `<i class="${i < p.tavernTier ? 'on' : ''}"></i>`).join('')}</span>` : '—';
    $('gold').textContent = p ? `${p.gold}/${p.maxGold}` : '—';
    $('coins').innerHTML = p ? Array.from({ length: Math.min(p.maxGold, 10) }, (_, i) => `<i class="${i < p.gold ? 'on' : ''}"></i>`).join('') : '';
    $('races').innerHTML = (s.availableRaces || []).map(r => `<span class="race">${RACE[r] || r}</span>`).join('');

    const root = $('root');
    if (!s.inGame || !s.isBattlegrounds) {
      root.innerHTML = `<div class="center"><b>${s.inGame ? '当前不是酒馆战旗对局' : '等待对局开始'}</b>进入酒馆战旗后，这里会实时显示局面和每回合的建议。</div>`;
      return;
    }
    const rail = `<aside class="rail">
        <div class="card-box"><h3>排行榜</h3>${leaderboardHtml(s)}</div>
        ${p ? `<div class="card-box"><h3>英雄</h3>${heroHtml(p)}</div>` : ''}
        ${weightsHtml(s)}
      </aside>`;
    if (s.phase === 'hero_select' || !p) {
      root.innerHTML = `<div class="page"><div class="main">${offeredHtml(s)}<div class="center"><b>${s.phase === 'hero_select' ? '正在选择英雄' : '读取中'}</b>选好英雄后开始显示酒馆和建议。</div></div>${rail}</div>`;
      return;
    }

    const recruit = s.phase === 'recruit';
    const shopRow = recruit
      ? `<section class="block"><h2>鲍勃的酒馆 <span class="sub">${(s.tavern || []).some(c => c.frozen) ? '有冻结的随从' : ''}</span></h2>${row(s.tavern, '酒馆是空的')}</section>`
      : s.opponent ? `<section class="block"><h2>对手：${esc(s.opponent.heroName || '')} <span class="sub">${s.opponent.health} 血，${s.opponent.tavernTier} 本</span></h2>${row(s.opponent.board, '对手场上没有随从')}</section>` : '';
    const extras = [...(p.trinkets || []), ...(p.questRewards || [])];

    root.innerHTML = `<div class="page">
      <div class="main">
        ${offeredHtml(s)}
        ${recruit ? adviceHtml(s) : liveHtml(s)}
        ${recruit ? ledgerHtml(s) : ''}
        ${shopRow}
        <section class="block"><h2>你的场面 <span class="sub">${p.board.length}/7，从左到右</span></h2>${row(p.board, '场上没有随从')}</section>
        <div class="board-split">
          <section class="block"><h2>手牌 <span class="sub">${p.hand.length}/10</span></h2>${row(p.hand, '手牌是空的', { showCost: true })}</section>
          ${extras.length ? `<section class="block"><h2>饰品和任务奖励</h2>${row(extras, '')}</section>` : ''}
        </div>
        ${matchupsHtml(s)}
        ${turnLogHtml(s)}
      </div>
      ${rail}
    </div>`;
    markBestPlan(s);
  }

  // ---------- 数据源 ----------
  let latest = null;
  function show(state, mode) {
    latest = state;
    render(state);
    $('raw').textContent = JSON.stringify(state, null, 2);
    $('seq').textContent = state.seq ? `#${state.seq}` : '';
    const pi = state.plugin;
    $('ver').textContent = pi && pi.version ? 'v' + pi.version : '';
    const ub = $('updateBanner');
    ub.hidden = !(pi && (pi.updateReady || pi.updateError));
    if (pi && pi.updateReady) ub.textContent = `新版本 ${pi.latestVersion} 已自动下载，完全退出 HDT（托盘图标右键“退出”）再打开后生效。`;
    else if (pi && pi.updateError) ub.textContent = `自动更新没成功：${pi.updateError}。可以到 GitHub 的 Releases 页面手动下载 zip，拖进 HDT 的插件列表。`;
    $('ver').title = pi && pi.latestVersion === '' ? '已是最新版本' : '';
    const dot = $('dot');
    dot.className = 'dot ' + (mode === 'live' ? 'ok' : mode === 'demo' ? 'demo' : '');
    $('connText').textContent = mode === 'live' ? '已连接 HDT' : mode === 'demo' ? '演示数据' : '未连接';
  }

  $('copyBtn').addEventListener('click', e => {
    e.preventDefault();
    if (latest) navigator.clipboard?.writeText(JSON.stringify(latest, null, 2));
  });

  const params = new URLSearchParams(location.search);
  const onServer = location.protocol.startsWith('http') && location.port === (params.get('port') || '8765');
  const base = params.get('server') || (onServer ? '' : 'http://localhost:8765');

  let demoMode = false;
  function requestOptimize(opponentId) {
    if (!demoMode) {
      fetch(base + '/optimize?opponent=' + opponentId, { cache: 'no-store' })
        .then(r => r.json())
        .then(r => { if (!r.accepted) alert(r.message || '无法开始优化'); })
        .catch(() => alert('请求失败：插件没有连接'));
      return;
    }
    const opp = DEMO.simulation.matchups.results.find(r => r.opponentPlayerId === opponentId) || {};
    const cur = DEMO.player.board.map(m => m.entityId);
    const best = [103, 101, 102, 104, 105, 106];
    const base0 = { winRate: opp.winRate, tieRate: opp.tieRate, lossRate: opp.lossRate, winLethal: 0, lossLethal: 0, avgDamageDealt: opp.avgDamageDealt, avgDamageTaken: opp.avgDamageTaken, simulationCount: 6000 };
    const o = { status: 'running', requestId: 1, opponentPlayerId: opponentId, opponentHeroName: opp.heroName, boardSeenTurn: opp.boardSeenTurn,
                currentOrder: cur, bestOrder: [], bestOrderNames: [], evaluated: 0 };
    DEMO.simulation.optimizer = o; show(DEMO, 'demo');
    let n = 0;
    const tick = setInterval(() => {
      n += 7; o.evaluated = n; if (n > 20) o.bestOrder = best;
      if (n >= 49) {
        clearInterval(tick);
        Object.assign(o, { status: 'done', evaluated: 49, bestOrder: best, current: base0,
          best: Object.assign({}, base0, { winRate: Math.min(0.97, base0.winRate + 0.064), lossRate: Math.max(0.01, base0.lossRate - 0.058), tieRate: base0.tieRate - 0.006 }),
          message: '调整后（胜率 - 负率）提升 12.2 个百分点' });
      }
      show(DEMO, 'demo');
    }, 350);
  }

  function showDemo(reason) {
    demoMode = true;
    const b = $('banner');
    b.hidden = false;
    b.innerHTML = reason;
    show(DEMO, 'demo');
  }

  if (params.has('demo')) {
    if (params.get('demo') === 'combat') {
      // 战斗阶段演示：酒馆隐藏，显示本回合对手
      DEMO.phase = 'combat';
      DEMO.tavern = [];
      DEMO.opponent = {
        heroCardId: 'TB_BaconShop_HERO_08', heroName: '伊利丹·怒风', health: 27, armor: 2, tavernTier: 4,
        board: [
          m({ entityId: 301, cardId: 'BGS_048', name: '南海船工', position: 1, attack: 9, health: 7, tier: 4, races: ['PIRATE'] }),
          m({ entityId: 302, cardId: 'BG26_135', name: '南海卖艺者', position: 2, attack: 6, health: 6, tier: 2, races: ['PIRATE'], windfury: true }),
          m({ entityId: 303, cardId: 'BG25_032', name: '佩吉·硬骨', position: 3, attack: 8, health: 10, tier: 4, races: ['PIRATE'], divineShield: true }),
          m({ entityId: 304, cardId: 'BGS_072', name: '霍加尔船长', position: 4, attack: 12, health: 12, tier: 6, races: ['PIRATE'], golden: true, taunt: true })
        ]
      };
      DEMO.simulation.live = { turn: 9, state: 'Combat', errorState: 'None', hasResult: true, winRate: 0.641, tieRate: 0.058, lossRate: 0.301,
        winLethal: 0, lossLethal: 0, avgDamageDealt: 10.6, avgDamageTaken: 8.0, simulationCount: 10000 };
    }
    showDemo('演示模式：显示的是示例数据（<code>?demo</code> 招募阶段，<code>?demo=combat</code> 战斗阶段）。去掉网址参数即连接 HDT。');
    return;
  }

  let failures = 0;
  function poll() {
    fetch(base + '/state.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(s => { failures = 0; demoMode = false; $('banner').hidden = true; show(s, 'live'); })
      .catch(() => {
        failures++;
        if (failures === 3) showDemo('连不上 HDT 插件（<code>' + esc(base || location.origin) + '</code>）。请确认 HDT 已打开并启用了 BG State Exporter 插件。下面先显示示例数据，连上后会自动切换。');
      })
      .finally(() => setTimeout(poll, failures ? 2000 : 1000));
  }

  if (window.EventSource) {
    const es = new EventSource(base + '/events');
    let gotEvent = false;
    es.onmessage = ev => { gotEvent = true; failures = 0; demoMode = false; $('banner').hidden = true; show(JSON.parse(ev.data), 'live'); };
    es.onerror = () => {
      if (!gotEvent) { es.close(); poll(); }      // 推送不可用就退回轮询
      else $('connText').textContent = '重连中…';
    };
  } else {
    poll();
  }

})();
</script>
</body>
</html>

# B1-B3 checks on CPU: opponent profile vs bots, model/action-head tests, a tiny PPO run.
# Uses the Linux TavernGym wheel from the prerelease taverngym-<commit>.
name: bgrl RL checks

on:
  push:
    paths: ["bgrl/rl/**", "bgrl/tg/**", "bgrl/third_party/**", "bgrl/tools/tavernbench.py", "bgrl/bg.py", "bgrl/paths.py", "bgrl/tools/train.py", "bgrl/tools/make_demos.py", "bgrl/tools/pro_library.py", "bgrl/tools/opp_profile.py", "bgrl/tools/shadow.py", "bgrl/tests/**", "bgrl/arena/**", ".github/workflows/bgrl-rl.yml"]
  workflow_dispatch:

jobs:
  rl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TavernGym wheel + torch (CPU)
        run: |
          commit=$(grep '^commit=' bgrl/taverngym/PIN.txt | cut -d= -f2)
          tag="taverngym-${commit:0:7}"
          whl="taverngym-1.0.0-cp310-abi3-linux_x86_64.whl"
          curl -sSfL -o "$whl" "https://github.com/${{ github.repository }}/releases/download/$tag/$whl"
          python -m pip install numpy "$whl"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (model / action heads / GAE / shadow advisor) via the bg.py entry point
        run: |
          python -X utf8 bgrl/bg.py info
          python -X utf8 bgrl/bg.py test
      - name: TavernBench runner (C3, random tiny model)
        run: python -X utf8 bgrl/bg.py tavernbench --smoke
      - name: Opponent profile (real vs bots)
        run: python -X utf8 bgrl/bg.py profile --games 24 --annotate
      - name: Tiny PPO run
        run: |
          python -X utf8 bgrl/bg.py train --smoke --threads 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-from-turn 3 --boost-every 1 --boost-ramp-iters 2
      - name: Demos from the replay fixture + tiny PPO run with imitation
        run: |
          python -X utf8 bgrl/bg.py demos --fixture bgrl/tests/fixtures/replay_v3.jsonl.gz
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --bc-coef 0.05 --boost-frac 1.0 --boost-from-turn 3 --bc-weights "upgrade:3,sell:3,buy:2" --bc-train-cap 0.6 --bc-smooth 0.1 --tempo-bonus 0.03 --refresh-waste-penalty 0.015
      - name: Pro-board library from a synthetic sample + tiny PPO run with pro boards
        run: |
          python -X utf8 bgrl/bg.py prolib bgrl/tests/fixtures/pro_games_sample.jsonl --profile-out bgrl/runs/_pro_profile_ci.json
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --tempo-curve pro --tempo-bonus 0.03

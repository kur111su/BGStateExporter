# B1-B3 checks on CPU: opponent profile vs bots, model/action-head tests, a tiny PPO run.
# Uses the Linux TavernGym wheel from the prerelease taverngym-<commit>.
name: bgrl RL checks

on:
  push:
    paths: ["bgrl/rl/**", "bgrl/tg/**", "bgrl/third_party/**", "bgrl/tools/**", "bgrl/configs/**", "bgrl/panel/**", "bgrl/requirements.txt", "bgrl/bg.py", "bgrl/paths.py", "bgrl/tests/**", "bgrl/arena/**", ".github/workflows/bgrl-rl.yml"]
  workflow_dispatch:

jobs:
  rl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TavernGym wheel + torch (CPU)
        run: |
          commit=$(grep '^commit=' bgrl/taverngym/PIN.txt | cut -d= -f2)
          tag="taverngym-${commit:0:7}"
          whl="taverngym-1.0.0-cp310-abi3-linux_x86_64.whl"
          curl -sSfL -o "$whl" "https://github.com/${{ github.repository }}/releases/download/$tag/$whl"
          python -m pip install numpy "$whl"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (model / action heads / GAE) via the bg.py entry point
        run: |
          python -X utf8 bgrl/bg.py info
          python -X utf8 bgrl/bg.py test
      - name: TavernBench runner (C3, random tiny model)
        run: python -X utf8 bgrl/bg.py tavernbench --smoke
      - name: Opponent profile (real vs bots)
        run: python -X utf8 bgrl/bg.py profile --games 24 --annotate
      - name: Tiny PPO run
        run: |
          python -X utf8 bgrl/bg.py train --smoke --threads 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --resume --restore bgrl/runs/_smoke/snapshots/it00002.pt
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-from-turn 3 --boost-every 1 --boost-ramp-iters 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 3 --lobby-must BEAST --lobby-frac 1.0 --lobby-exam true --trick-bonus 0.05 --trick-from-turn 2 --trick-engine rally --commit-comp 龙虾流野兽 --commit-frac 0.5 --commit-from-turn 2 --commit-force BG36_202,BG36_201,BG36_204 --commit-tiers 2:3,3:5 --lobster-coef 0.05 --eval-every 2 --eval-games 4 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --recipe bgrl/configs/v3.json
      - name: Pro-board library from a synthetic sample + tiny PPO run with pro boards
        run: |
          python -X utf8 bgrl/bg.py prolib bgrl/tests/fixtures/pro_games_sample.jsonl --profile-out bgrl/runs/_pro_profile_ci.json
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --tempo-curve pro --tempo-bonus 0.03 --tempo-deficit 0.01
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --seed-comp-frac 1.0 --seed-comp-turns 3,4 --boost-min-strength 0.5 --boost-min-step 0.1 --combat-bonus 0.3 --grow-bonus 0.3 --grow-from-turn 3 --grow-frac 1.0 --gift-frac 0.5 --gift-turns 2,3 --gift-p 1.0
      - name: External model loader (random weights in the same file format) + tiny PPO run with it as teacher + goldflow with it
        run: |
          python -X utf8 bgrl/tests/test_extnet.py
          python -X utf8 -c "import sys; sys.path.insert(0, 'bgrl'); sys.path.insert(0, 'bgrl/tests'); from pathlib import Path; from test_extnet import fake_ckpt; fake_ckpt(Path('bgrl/runs/_ext_ci.pt'))"
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --teacher bgrl/runs/_ext_ci.pt --teacher-coef 0.03 --teacher-ramp 2 --teacher-actions sell,buy --teacher-from-turn 1 --teacher-conf 0.05 --teacher-frac 0.5
          python -X utf8 bgrl/bg.py goldflow --games 4 --threads 2 --ckpt bgrl/runs/_ext_ci.pt
          python -X utf8 bgrl/bg.py goldflow --games 4 --threads 2 --ckpt bgrl/runs/_ext_ci.pt --lobby BEAST
          python -X utf8 bgrl/bg.py goldflow --games 4 --threads 2 --ckpt bgrl/runs/_ext_ci.pt --lobby BEAST --commit 龙虾流野兽 --commit-force BG36_202,BG36_201 --commit-tiers 3:5,4:7
          python -X utf8 bgrl/bg.py goldflow --policy lobster --games 48 --threads 2 --lobby BEAST
          echo '{"turns": {"8": [{"tier": 4, "board": [["BG36_204", 20, 20], ["BG36_202", 5, 5], ["BG36_208", 10, 11], ["BG25_354", 1, 7]]}, {"tier": 4, "board": [["BG36_098", 9, 9], ["BG36_201", 4, 4]]}, {"tier": 4, "board": [["BG36_210", 6, 6]]}]}}' > bgrl/runs/_cs_lib.json && python -X utf8 bgrl/bg.py compstrength --lib bgrl/runs/_cs_lib.json --turns 8 --k 2 --max 2 --fights 2 --lobster-bonus 0,20
          python -X utf8 bgrl/bg.py distill --smoke --threads 2 --teacher bgrl/runs/_ext_ci.pt
          python -X utf8 bgrl/bg.py distill --smoke --threads 2
          python -X utf8 bgrl/tests/test_lobby.py
          python -X utf8 bgrl/bg.py bench-model --smoke --threads 2 --device cpu
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 3 --profile-update true --aux-comp-coef 0.05 --teacher bgrl/runs/_smoke/latest.pt --teacher-coef 0.03 --teacher-ramp 1 --verbose
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 6 --teacher bgrl/runs/_ext_ci.pt --teacher-coef 0.03 --teacher-ramp 2
          python -X utf8 bgrl/arena/export.py --ckpt bgrl/runs/_ext_ci.pt --out bgrl/runs/_ext_bundle_ci && exit 1 || test ! -e bgrl/runs/_ext_bundle_ci/model.pt
      - name: 6500+ replay converter on a synthetic replay + tiny PPO run imitating it
        run: |
          python -X utf8 bgrl/tests/test_hsreplay.py --write-sample bgrl/runs/_replays
          python -X utf8 bgrl/bg.py prodemos bgrl/runs/_replays --workers 1 --val-every 3
          python -X utf8 bgrl/tests/test_review_pack.py bgrl/runs/_packs_ci
          python -X utf8 bgrl/bg.py prodemos bgrl/runs/_packs_ci --workers 1 --val-every 3 --out bgrl/runs/_pack_demos_ci
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --pro-weights "upgrade:3,end:2"
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 8 --pro-coef 0.05 --pro-weights "upgrade:3,tgtnew:3,lobnew:2" --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --teacher bgrl/runs/_smoke/latest.pt --teacher-coef 0.03 --teacher-ramp 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --pro-weights "upgrade:3,simkey:2,simsyn:2,engine:3,tgtS:2,tgtfit:2" --demo-shop-shuffle true --combat-bonus 0.3 --combat-from-turn 2 --econ-bonus 0.01
          python -X utf8 bgrl/bg.py simcards --per-turn 3 --out bgrl/runs/_sim_value_ci.json
          python -X utf8 bgrl/bg.py playbook --pro-data bgrl/runs/pro_demos --out bgrl/runs/_target_comps_ci.json
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --teacher bgrl/runs/_smoke/latest.pt --teacher-coef 0.03 --teacher-ramp 2 --teacher-core-mult 3 --aux-comp-coef 0.05 --keep-penalty 0.05
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 7 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --pro-coef 0.05 --teacher bgrl/runs/_smoke/latest.pt --teacher-coef 0.03 --combat-bonus 0.3 --combat-from-turn 2 --shape-repay 1 --shape-repay-ramp 2 --guard true --guard-window 1 --guard-patience 1 --guard-margin 0 --ent-target 1.0 --warmup-iters 2 --place-reward 1:1,2:0.55,3:0.25,4:0.05,5:-0.15,6:-0.4,7:-0.7,8:-1
          test -f bgrl/runs/_smoke/best.pt
          python -X utf8 bgrl/bg.py board --run bgrl/runs/_smoke
          test -f bgrl/runs/_smoke/dashboard.md
      - name: Cleanup preview
        run: |
          cd bgrl
          python -X utf8 bg.py cleanup

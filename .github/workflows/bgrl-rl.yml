# B1-B3 checks on CPU: opponent profile vs bots, model/action-head tests, a tiny PPO run.
# Uses the Linux TavernGym wheel from the prerelease taverngym-<commit>.
name: bgrl RL checks

on:
  push:
    paths: ["bgrl/rl/**", "bgrl/tg/**", "bgrl/third_party/**", "bgrl/tools/**", "bgrl/configs/**", "bgrl/panel/**", "bgrl/requirements.txt", "bgrl/bg.py", "bgrl/paths.py", "bgrl/tests/**", "bgrl/arena/**", ".github/workflows/bgrl-rl.yml"]
  workflow_dispatch:

jobs:
  rl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TavernGym wheel + torch (CPU)
        run: |
          commit=$(grep '^commit=' bgrl/taverngym/PIN.txt | cut -d= -f2)
          tag="taverngym-${commit:0:7}"
          whl="taverngym-1.0.0-cp310-abi3-linux_x86_64.whl"
          curl -sSfL -o "$whl" "https://github.com/${{ github.repository }}/releases/download/$tag/$whl"
          python -m pip install numpy "$whl"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (model / action heads / GAE) via the bg.py entry point
        run: |
          python -X utf8 bgrl/bg.py info
          python -X utf8 bgrl/bg.py test
      - name: TavernBench runner (C3, random tiny model)
        run: python -X utf8 bgrl/bg.py tavernbench --smoke
      - name: Opponent profile (real vs bots)
        run: python -X utf8 bgrl/bg.py profile --games 24 --annotate
      - name: Tiny PPO run
        run: |
          python -X utf8 bgrl/bg.py train --smoke --threads 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --resume --restore bgrl/runs/_smoke/snapshots/it00002.pt
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-from-turn 3 --boost-every 1 --boost-ramp-iters 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --recipe bgrl/configs/v3.json
      - name: Pro-board library from a synthetic sample + tiny PPO run with pro boards
        run: |
          python -X utf8 bgrl/bg.py prolib bgrl/tests/fixtures/pro_games_sample.jsonl --profile-out bgrl/runs/_pro_profile_ci.json
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --tempo-curve pro --tempo-bonus 0.03 --tempo-deficit 0.01
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --seed-comp-frac 1.0 --seed-comp-turns 3,4 --boost-min-strength 0.5 --boost-min-step 0.1 --combat-bonus 0.3 --grow-bonus 0.3 --grow-from-turn 3 --grow-frac 1.0 --gift-frac 0.5 --gift-turns 2,3 --gift-p 1.0 --cgift-frac 0.4 --cgift-turns 2,3,4 --cgift-p 1.0 --target-bonus 0.5
      - name: 6500+ replay converter on a synthetic replay + tiny PPO run imitating it
        run: |
          python -X utf8 bgrl/tests/test_hsreplay.py --write-sample bgrl/runs/_replays
          python -X utf8 bgrl/bg.py prodemos bgrl/runs/_replays --workers 1 --val-every 3
          python -X utf8 bgrl/tests/test_review_pack.py bgrl/runs/_packs_ci
          python -X utf8 bgrl/bg.py prodemos bgrl/runs/_packs_ci --workers 1 --val-every 3 --out bgrl/runs/_pack_demos_ci
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --pro-weights "upgrade:3,end:2"
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --pro-weights "upgrade:3,simkey:2,simsyn:2,engine:3,tgtS:2,tgtfit:2" --target-bonus 0.15 --demo-shop-shuffle true --combat-bonus 0.3 --combat-from-turn 2 --econ-bonus 0.01 --comp-bonus 0.03 --comp-weights "1,0,0"
          python -X utf8 bgrl/bg.py simcards --per-turn 3 --out bgrl/runs/_sim_value_ci.json
          python -X utf8 bgrl/bg.py playbook --pro-data bgrl/runs/pro_demos --out bgrl/runs/_target_comps_ci.json
          python -X utf8 bgrl/bg.py teacher --init bgrl/runs/_smoke/latest.pt --pro-data bgrl/runs/pro_demos --steps 6 --eval-every 3 --batch 16 --out bgrl/runs/_teacher_ci.pt
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --pro-coef 0.05 --teacher bgrl/runs/_teacher_ci.pt --teacher-coef 0.03 --teacher-ramp 2 --teacher-core-mult 3 --aux-comp-coef 0.05 --target-bonus 0.3 --target-from-turn 2 --keep-penalty 0.05 --engine-bonus 0.4 --engine-from-turn 2
          python -X utf8 bgrl/bg.py train --smoke --threads 2 --iters 7 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --pro-coef 0.05 --teacher bgrl/runs/_teacher_ci.pt --teacher-coef 0.03 --target-bonus 0.3 --target-from-turn 2 --engine-bonus 0.4 --engine-from-turn 2 --combat-bonus 0.3 --combat-from-turn 2 --shape-repay 1 --shape-repay-ramp 2 --guard true --guard-window 1 --guard-patience 1 --guard-margin 0 --ent-target 1.0 --warmup-iters 2 --place-reward 1:1,2:0.55,3:0.25,4:0.05,5:-0.15,6:-0.4,7:-0.7,8:-1
          test -f bgrl/runs/_smoke/best.pt
          python -X utf8 bgrl/bg.py board --run bgrl/runs/_smoke
          test -f bgrl/runs/_smoke/dashboard.md
      - name: Panel (Streamlit page opens with and without a training log; task layer is in the unit tests)
        run: |
          python -m pip install -q "streamlit>=1.37"
          cd bgrl
          python -X utf8 -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('panel/app.py', default_timeout=120).run(); assert not at.exception, at.exception; print('empty OK', len(at.metric))"
          mkdir -p runs/v3 && cp runs/_smoke/log.jsonl runs/_smoke/dashboard.md runs/v3/
          python -X utf8 -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('panel/app.py', default_timeout=120).run(); assert not at.exception, at.exception; assert len(at.metric) > 5, len(at.metric); print('with log OK', len(at.metric))"
          python -X utf8 bg.py cleanup

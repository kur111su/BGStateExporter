# Desktop panel (bgrl/panel/gui.py, PySide6 + pyqtgraph): open every page with fake data, click through, keep screenshots.
name: bgrl GUI panel

on:
  push:
    paths: ["bgrl/panel/**", "bgrl/tests/gui_smoke.py", "bgrl/arena/viewer.py", "bgrl/rl/board.py", ".github/workflows/bgrl-gui.yml"]
  workflow_dispatch:

jobs:
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries and a CJK font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-noto-cjk
      - name: Install PySide6 + pyqtgraph
        run: python -m pip install -q numpy "PySide6>=6.6" "pyqtgraph>=0.13"
      - name: Open every page, click through, take screenshots
        run: python -X utf8 bgrl/tests/gui_smoke.py shots
      - name: Screenshots into the log (base64 JPEG; the artifact below has the PNGs)
        if: always()
        run: |
          python - <<'PY'
          import base64, os, pathlib
          os.environ["QT_QPA_PLATFORM"] = "offscreen"
          from PySide6 import QtGui
          app = QtGui.QGuiApplication([])
          for p in sorted(pathlib.Path("shots").glob("*.png")):
              img = QtGui.QImage(str(p))
              j = p.with_suffix(".jpg")
              img.save(str(j), "JPG", 72)
              print("@@B64-BEGIN", p.stem.split("_")[0])
              b = base64.b64encode(j.read_bytes()).decode()
              for i in range(0, len(b), 3000):
                  print("@@" + b[i:i + 3000])
              print("@@B64-END")
              j.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-shots
          path: shots

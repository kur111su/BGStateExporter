# Check of our TavernGym bridge (A4) against recorded recruit states, on the wheel we publish
# (prerelease taverngym-<commit>). Results are printed as annotations.
name: bgrl TavernGym checks

on:
  push:
    paths: ["bgrl/tg/**", "bgrl/tests/**", "bgrl/bg.py", "bgrl/paths.py", "bgrl/tools/tg_bridge_check.py", ".github/workflows/bgrl-tg.yml"]
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TavernGym wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="taverngym-$(grep '^commit=' bgrl/taverngym/PIN.txt | cut -d= -f2 | cut -c1-7)"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*manylinux*x86_64*.whl' --pattern '*linux_x86_64*.whl' --dir whl || true
          python -m pip install numpy whl/*.whl
      - name: Bridge check (A4)
        run: python -X utf8 bgrl/tools/tg_bridge_check.py bgrl/tests/fixtures/recruit_states_v2.jsonl bgrl/tests/fixtures/recruit_states_v3.jsonl --annotate --out bridge_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tg-reports
          path: bridge_report.json

# 重构验收：同一组固定种子的小训练，在 base（改动前）和这次提交上各跑一遍，日志逐轮要一样（计时字段除外）。
name: bgrl repro

# 触发：推到 dev、提交说明里带 [repro]；对照的提交写在 bgrl/tests/repro_base.txt。
on:
  push:
    branches: [dev]

jobs:
  repro:
    if: contains(github.event.head_commit.message, '[repro]')
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TavernGym wheel + torch (CPU)
        run: |
          commit=$(grep '^commit=' bgrl/taverngym/PIN.txt | cut -d= -f2)
          tag="taverngym-${commit:0:7}"
          whl="taverngym-1.0.0-cp310-abi3-linux_x86_64.whl"
          curl -sSfL -o "$whl" "https://github.com/${{ github.repository }}/releases/download/$tag/$whl"
          python -m pip install numpy "$whl"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Base tree
        run: git worktree add ../base "$(tr -d '[:space:]' < bgrl/tests/repro_base.txt)"
      - name: Runs
        run: |
          set -e
          cp bgrl/tests/compare_logs.py /tmp/compare_logs.py
          for side in head base; do
            if [ "$side" = head ]; then root="$PWD/bgrl"; else root="$(cd ../base/bgrl && pwd)"; fi
            out="/tmp/repro/$side"; mkdir -p "$out"
            cd "$root"; mkdir -p runs
            python -X utf8 -c "import sys; sys.path.insert(0, '.'); sys.path.insert(0, 'tests'); from pathlib import Path; from test_extnet import fake_ckpt; fake_ckpt(Path('runs/_ext_repro.pt'))"
            run() { name=$1; shift; rm -rf runs/_smoke; python -X utf8 bg.py train --smoke --threads 1 --seed 7 "$@" > "$out/$name.txt" 2>&1 || { tail -30 "$out/$name.txt"; exit 1; }; cp runs/_smoke/log.jsonl "$out/$name.jsonl"; }
            run recipe --iters 6 --recipe configs/v3.json
            run plain --iters 6
            run curricula --iters 6 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --seed-comp-frac 1.0 --seed-comp-turns 3,4 --boost-min-strength 0.5 --boost-min-step 0.1 --combat-bonus 0.3 --grow-bonus 0.3 --grow-from-turn 3 --grow-frac 1.0 --gift-frac 0.5 --gift-turns 2,3 --gift-p 1.0 --cgift-frac 0.4 --cgift-turns 2,3,4 --cgift-p 1.0 --target-bonus 0.5 --engine-bonus 0.4 --engine-from-turn 2 --keep-penalty 0.05 --econ-bonus 0.01 --comp-bonus 0.03 --shape-repay 1 --shape-repay-ramp 2
            run teacher --iters 6 --teacher runs/_ext_repro.pt --teacher-coef 0.03 --teacher-ramp 2 --teacher-from-turn 1 --teacher-conf 0.05 --teacher-frac 0.5 --tribe-frac 1.0 --tribe-full true --tribe-start-p 1.0 --tribe-start-turn 2 --tribe-start-cards 2 --tribe-comps 圣盾流龙族,喝茶流 --tribe-teacher-off true --boost-frac 1.0 --boost-kind pro --boost-from-turn 3
            run guard --iters 7 --boost-frac 1.0 --boost-kind pro --boost-from-turn 3 --guard true --guard-window 1 --guard-patience 1 --guard-margin 0 --ent-target 1.0 --warmup-iters 2 --place-reward 1:1,2:0.55,3:0.25,4:0.05,5:-0.15,6:-0.4,7:-0.7,8:-1
            cd - > /dev/null
          done
          fail=0
          for f in /tmp/repro/head/*.jsonl; do n=$(basename "$f"); python -X utf8 /tmp/compare_logs.py "/tmp/repro/base/$n" "$f" || fail=1; done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-logs
          path: /tmp/repro
